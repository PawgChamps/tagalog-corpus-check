name: harvest example sentences from mC4 Tagalog
on:
  push:
    branches: [main]
    paths: [harvest/**, .github/workflows/harvest.yml]
  workflow_dispatch:
    inputs:
      max_docs:
        description: "stop after N documents (empty = whole corpus)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "datasets>=2.19"
      - name: harvest
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.max_docs || '' }}" ]; then ARGS="--max-docs ${{ github.event.inputs.max_docs }}"; fi
          cd harvest && python3 mc4_harvest.py --targets targets.tsv --known known.txt --natives natives.txt --english english.txt --out candidates.jsonl.gz $ARGS
          ls -la candidates.jsonl.gz
      - uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: harvest/candidates.jsonl.gz
      - name: commit candidates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add harvest/candidates.jsonl.gz
          git commit -m "candidates.jsonl.gz from mC4 fil" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
