name: count words in mC4 Tagalog
on:
  workflow_dispatch:
    inputs:
      max_docs:
        description: "stop after N documents (empty = whole corpus)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "datasets>=2.19"
      - name: count
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.max_docs }}" ]; then ARGS="--max-docs ${{ github.event.inputs.max_docs }}"; fi
          python3 count_corpus.py --dataset allenai/c4 --config tl --out counts.tsv $ARGS
          tail -3 counts.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: counts
          path: counts.tsv
      - name: commit counts.tsv
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add counts.tsv
          git commit -m "counts.tsv from mC4 tl" || echo "nothing to commit"
          git push
